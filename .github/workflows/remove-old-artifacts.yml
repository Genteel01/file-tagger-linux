name: Remove old artifacts

on:
  schedule:
    # Every Sunday at 3am
    - cron: '0 3 * * 1'

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # For private repos
    permissions:
      actions: write

    steps:
    - name: Remove old artifacts
      uses: c-hive/gha-remove-artifacts@v1
      with:
        age: '7 days' # '<number> <unit>', e.g. 5 days, 2 years, 90 seconds, parsed by Moment.js
        # Optional inputs
        skip-tags: true
        # skip-recent: 5
        # skip-recent-commits: 3
        # max-retries: 5
        # dry-run: true
