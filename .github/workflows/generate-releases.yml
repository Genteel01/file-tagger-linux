name: Generate Linux and Windows Releases

on:
  pull_request:
    types: [closed]
    branches: [ "master" ]
  push:
    branches: [ "building" ]

permissions:
  contents: write

jobs:
  build_portable:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    name: Build Portable ${{ matrix.runtimes }}

    strategy:
      matrix:
        runtimes: [linux-x64, win-x64]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: FileTagger.sln
      Project_Path: FileTagger/FileTagger.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event_name == 'push' && 'building' || github.event.pull_request.merge_commit_sha }}

    # Install the .NET Core workload
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 10.0.x

    # Restore the application to populate the obj folder
    - name: Restore the application
      run: dotnet build $env:Solution_Name -c Release

    - name: Publish
      run: >-
        dotnet publish $env:Project_Path
        -c Release
        -r $env:Runtimes
        -p:IncludeNativeLibrariesForSelfExtract=true
        -o ./publish
      env:
        Runtimes: ${{ matrix.runtimes }}

    - name: Rename executable
      shell: pwsh
      run: |
        $runtime = "${{ matrix.runtimes }}"
        
        if ($runtime -eq "linux-x64") {
         $directory = "./publish/linux-x64"
         $source = "./publish/FileTagger"
         $destination = "./publish/linux-x64/NetTag-Linux-Portable"
        }
        elseif ($runtime -eq "win-x64") {
         $directory = "./publish/win-x64"
         $source = "./publish/FileTagger.exe"
         $destination = "./publish/win-x64/NetTag-Windows-Portable.exe"
        }
        else {
         Write-Error "Unsupported runtime: $runtime"
         exit 1
        }
        
        if (-not (Test-Path $source -PathType Leaf)) {
         Write-Error "Executable not found: $source"
         Write-Host "Contents of publish directory:"
         Get-ChildItem "./publish" | Format-Table Name, Length
         exit 1
        }

        New-Item -Path $directory -Type Directory
        Rename-Item -Path $source -NewName (Split-Path $destination -Leaf)

        Write-Host "Created: $destination"

    - name: Upload build artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: NetTag-${{ matrix.runtimes }}
        path: ./publish/${{ matrix.runtimes }}/NetTag-*

  release:
    if: github.event.pull_request.merged == true
    name: Create GitHub Release
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Get next release number
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $count = gh release list --repo "${{ github.repository }}" --limit 1000 --json name --jq 'length'
          $next = [int]$count + 1
          
          Write-Host "Previous releases: $count"
          Write-Host "Next release number: $next"
          
          "number=$next" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          tag_name: AutomatedRelease${{ steps.release.outputs.number }}
          name: NetTag ${{ steps.release.outputs.number }}
          body: |
            ## ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.body }}

            [View full changelog](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/commits)