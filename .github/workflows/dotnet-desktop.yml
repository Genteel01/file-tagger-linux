# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# To configure this workflow:
#
# 1. Configure environment variables
# GitHub sets default environment variables for every workflow run.
# Replace the variables relative to your project in the "env" section below.
#
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: .NET Core Desktop

on:
  push:
    branches: [ "master", "workflow-testing" ]

permissions:
  contents: write

jobs:

  build:
    name: Build ${{ matrix.runtimes }}

    strategy:
      matrix:
        configuration: [Release]
        runtimes: [linux-x64, win-x64]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: FileTagger.sln                         # Replace with your solution name, i.e. MyWpfApp.sln.
      Project_Path: FileTagger/FileTagger.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: dotnet build $env:Solution_Name -c $env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Publish
      run: dotnet publish $env:Project_Path -c $env:Configuration -r $env:Runtimes --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish
      env:
        Configuration: ${{ matrix.configuration }}
        Runtimes: ${{ matrix.runtimes }}

    - name: Rename executable
      shell: pwsh
      run: |
        $runtime = "${{ matrix.runtimes }}"

        if ($runtime -eq "linux-x64") {
         $source = "./publish/FileTagger"
         $destination = "./publish/FileTagger-${{ github.ref_name }}-linux-x64"
        }
        elseif ($runtime -eq "win-x64") {
         $source = "./publish/FileTagger.exe"
         $destination = "./publish/FileTagger-${{ github.ref_name }}-win-x64.exe"
        }
        else {
         Write-Error "Unsupported runtime: $runtime"
         exit 1
        }

        if (-not (Test-Path $source -PathType Leaf)) {
         Write-Error "Executable not found: $source"
         Write-Host "Contents of publish directory:"
         Get-ChildItem "./publish" | Format-Table Name, Length
         exit 1
        }

        Rename-Item -Path $source -NewName (Split-Path $destination -Leaf)

        Write-Host "Created: $destination"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: FileTagger-${{ matrix.runtimes }}
        path: ./publish/FileTagger-${{ github.ref_name }}-${{ matrix.runtimes }}*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: FileTagger ${{ github.ref_name }}